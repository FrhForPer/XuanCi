[package]
name = "xuanci-latex"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"

# Standalone optional plugin; not part of the XuanCi workspace build.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
