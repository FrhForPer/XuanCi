[workspace]
resolver = "2"
members = ["crates/xuanci-core", "crates/xuanci-win", "crates/xuanci-app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["XuanCi"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
